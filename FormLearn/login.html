<html>
    <head>
        <title>Log in system</title>
    </head>
    <body>
        <form 
        action="https://tranduythanh.com/process.html" method="get">
            <h1>Log in system</h1>
            <table>
                <tr>
                    <td>
                        <label for="username">Username:</label>
                    </td>
                    
                    <td><input type="text" name="username" id="username"/></td>
                </tr>
                <tr>
                    <td>
                        <label for="password">Password:</label>
                    </td>
                    
                    <td><input type="password" name="password" id="password"/></td>
                </tr>
                <tr>
                    <td>
                        &nbsp;
                    </td>
                    <td>
                        <input type="checkbox" name="save_login" id="save_login"/> <label for="save_login">Save login information</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Log in" />
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
